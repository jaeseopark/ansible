---
- name: Install FFmpeg
  apt:
    name: ffmpeg
    state: present
    update_cache: yes

- name: Create Durin Tapo stream script from template
  template:
    src: durin_stream.sh.j2
    dest: "{{ stream_script_path }}"
    mode: '0700'
    owner: root
    group: root

- name: Create systemd service for Durin stream from template
  template:
    src: stream-durin.service.j2
    dest: /etc/systemd/system/stream-durin.service
    mode: '0644'
    owner: root
    group: root

- name: Reload systemd daemon and start Durin service
  systemd:
    daemon_reload: yes
    name: stream-durin
    state: restarted
    enabled: yes
