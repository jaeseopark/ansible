- name: Save the current user as a variable
  ansible.builtin.command: whoami
  register: current_user

- name: Resolve numeric GIDs for groups in `data_groups`
  ansible.builtin.set_fact:
    data_groups: "{{ data_groups | default([]) }}"

- name: Lookup group GIDs for configured data_groups
  ansible.builtin.shell: "getent group {{ item }} | awk -F: '{print $3}'"
  loop: "{{ data_groups }}"
  register: data_group_gids
  changed_when: false
  failed_when: false

- name: Build list of missing groups (if any)
  ansible.builtin.set_fact:
    missing_data_groups: "{{ data_groups | zip(data_group_gids.results | map(attribute='stdout')) | selectattr('1','equalto','') | map('first') | list }}"

- name: Fail if any configured data_groups are not present on the host
  ansible.builtin.fail:
    msg: "The following groups listed in data_groups were not found on the host: {{ missing_data_groups }}"
  when: missing_data_groups | length > 0

- name: Set numeric GID array for later templating
  ansible.builtin.set_fact:
    data_gid_array: "{{ data_group_gids.results | map(attribute='stdout') | map('int') | list }}"

- name: Debug data_gid_array
  ansible.builtin.debug:
    msg: "data_gid_array={{ data_gid_array }}"
- name: Ensure git is installed
  package:
    name: git
    state: present
- name: Checkout the code base
  git:
    repo: "https://{{ git_token }}@github.com/jaeseopark/corganize-web.git"
    dest: "{{ app_path }}"
    version: "{{ branch }}"
    force: yes
- name: Ensure folder(s) exists
  file:
    path: "{{ item }}"
    mode: u=rwx,g=rwx,o=rx
    state: directory
  loop:
    - "{{ app_path }}"
    - "{{ mnt_path }}"
    - "{{ log_path }}"
- name: Check if docker compose file exists
  ansible.builtin.stat:
    dest: "{{ app_path }}/docker-compose.yml"
  register: docker_compose_file
- name: Ensure Docker Compose is stopped if the file exists
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}"
    state: absent
  when: docker_compose_file.stat.exists
- name: Copy docker file for the UI
  template:
    src: Dockerfile.ui.j2
    dest: "{{ app_path }}/crgw-ui/Dockerfile"
- name: Copy nginx entrypoint script
  template:
    src: setup-nginx-worker-user.j2
    dest: "{{ app_path }}/setup-nginx-worker-user.sh"
    mode: 0755
    directory_mode: 0755
- name: Copy compose file from the master node
  template:
    src: docker-compose.j2
    dest: "{{ app_path }}/docker-compose.yml"
- name: Copy env file from the master node
  template:
    src: env.j2
    dest: "{{ app_path }}/.env"
- name: Ensure Docker Compose is running (build errors may not surface -- try building manually on remote host if it takes too long (>10 minutes))
  community.docker.docker_compose_v2:
    project_src: "{{ app_path }}"
    state: present
    build: always
