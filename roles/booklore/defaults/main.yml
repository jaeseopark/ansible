---
# Path configuration
local_mount_path: "{{ app_path }}/mnt"
docker_compose_path: "{{ app_path }}/docker-compose.yml"

# Inventory lookups
booklore_app_object: "{{ apps | selectattr('name', 'equalto', 'booklore') | first }}"
booklore_port: "{{ booklore_app_object.port }}"
booklore_domain: "{{ booklore_app_object.deployed_domain }}"
booklore_host_name: "{{ booklore_app_object.host }}"

# Application environment
app_user_id: 1000
app_group_id: 1000
timezone: "{{ timezone }}"

# Database configuration (non-sensitive)
db_user: booklore
mysql_database: booklore
database_url: jdbc:mariadb://mariadb:3306/booklore

# MariaDB user IDs
db_user_id: 1000
db_group_id: 1000

# Storage configuration - use NETWORK since mounting NAS read-only
disk_type: NETWORK
